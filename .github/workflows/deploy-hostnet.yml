name: Deploy Hostnet

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Enviar arquivos para a Hostnet
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar chave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTNET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hostnet_deploy
          sed -i 's/\r$//' ~/.ssh/hostnet_deploy
          chmod 600 ~/.ssh/hostnet_deploy
          ssh-keyscan -p ${{ secrets.HOSTNET_PORT }} -H ${{ secrets.HOSTNET_HOST }} >> ~/.ssh/known_hosts

      - name: Testar conexão SSH
        run: |
          ssh -i ~/.ssh/hostnet_deploy -o IdentitiesOnly=yes -p ${{ secrets.HOSTNET_PORT }} \
            ${{ secrets.HOSTNET_USER }}@${{ secrets.HOSTNET_HOST }} \
            "echo 'Conexão SSH com a Hostnet funcionando.'"

      - name: Backup da versão atual na Hostnet
        run: |
          ssh -i ~/.ssh/hostnet_deploy -o IdentitiesOnly=yes -p ${{ secrets.HOSTNET_PORT }} \
            ${{ secrets.HOSTNET_USER }}@${{ secrets.HOSTNET_HOST }} \
            "mkdir -p ~/deploy-backups && \
             if [ -d '${{ secrets.HOSTNET_PATH }}' ] && [ \"\$(ls -A '${{ secrets.HOSTNET_PATH }}')\" ]; then \
               tar -czf ~/deploy-backups/backup-\$(date +%Y%m%d-%H%M%S).tar.gz -C '${{ secrets.HOSTNET_PATH }}' . ; \
             else echo 'Primeiro deploy: sem backup.'; fi"

      - name: Deploy com rsync
        run: |
          rsync -avz \
            --exclude-from=deploy-exclude.txt \
            -e "ssh -i ~/.ssh/hostnet_deploy -o IdentitiesOnly=yes -p ${{ secrets.HOSTNET_PORT }}" \
            ./ ${{ secrets.HOSTNET_USER }}@${{ secrets.HOSTNET_HOST }}:${{ secrets.HOSTNET_PATH }}

      - name: Executar migrações do banco de dados na Hostnet
        run: |
          ssh -i ~/.ssh/hostnet_deploy -o IdentitiesOnly=yes -p ${{ secrets.HOSTNET_PORT }} \
            ${{ secrets.HOSTNET_USER }}@${{ secrets.HOSTNET_HOST }} "bash -s -- ${{ secrets.HOSTNET_PATH }}" << 'EOF'
          RAW_PATH="$1"
          echo "======================================================"
          echo "Resolvendo caminho e interpretador PHP 8.2+ na Hostnet..."
          echo "======================================================"

          # Normaliza aspas se vierem por escape do SSH
          TARGET_PATH="${RAW_PATH%\'}"
          TARGET_PATH="${TARGET_PATH#\'}"
          TARGET_PATH="${TARGET_PATH%\"}"
          TARGET_PATH="${TARGET_PATH#\"}"

          # Expande til (~) para $HOME
          if [[ "$TARGET_PATH" =~ ^~/(.*) ]]; then
            TARGET_PATH="$HOME/${BASH_REMATCH[1]}"
          elif [ "$TARGET_PATH" = "~" ]; then
            TARGET_PATH="$HOME"
          fi

          # Se for caminho relativo, tenta resolver a partir de $HOME
          if [[ "$TARGET_PATH" != /* ]]; then
            if [ -d "$HOME/$TARGET_PATH" ]; then
              TARGET_PATH="$HOME/$TARGET_PATH"
            fi
          fi

          # Remove barra final se houver
          TARGET_PATH="${TARGET_PATH%/}"

          # Fallbacks caso o caminho precise de ajuste
          if [ ! -f "$TARGET_PATH/database/runner.php" ]; then
            if [ -f "$HOME/www/database/runner.php" ]; then
              TARGET_PATH="$HOME/www"
            elif [ -f "./database/runner.php" ]; then
              TARGET_PATH="."
            elif [ -f "$HOME/$RAW_PATH/database/runner.php" ]; then
              TARGET_PATH="$HOME/$RAW_PATH"
            fi
          fi

          echo "Caminho da aplicação na Hostnet: $TARGET_PATH"

          if [ ! -f "$TARGET_PATH/database/runner.php" ]; then
            echo "ERRO: Arquivo database/runner.php não encontrado em $TARGET_PATH"
            echo "Diretório atual: $(pwd)"
            ls -la
            exit 1
          fi

          PHP_BIN=""
          CANDIDATES=(
            "/usr/bin/php8.4"
            "/usr/local/php84/bin/php"
            "/usr/bin/php8.3"
            "/usr/local/php83/bin/php"
            "/usr/bin/php8.2"
            "/usr/local/php82/bin/php"
            "/usr/local/php8.4/bin/php"
            "/usr/local/php8.3/bin/php"
            "/usr/local/php8.2/bin/php"
            "/usr/bin/php84"
            "/usr/bin/php83"
            "/usr/bin/php82"
            "/opt/alt/php84/usr/bin/php"
            "/opt/alt/php83/usr/bin/php"
            "/opt/alt/php82/usr/bin/php"
            "/opt/cpanel/ea-php84/root/usr/bin/php"
            "/opt/cpanel/ea-php83/root/usr/bin/php"
            "/opt/cpanel/ea-php82/root/usr/bin/php"
            "/usr/local/bin/php8.4"
            "/usr/local/bin/php8.3"
            "/usr/local/bin/php8.2"
            "/usr/local/bin/php84"
            "/usr/local/bin/php82"
            "$(which php8.4 2>/dev/null)"
            "$(which php8.3 2>/dev/null)"
            "$(which php8.2 2>/dev/null)"
            "$(which php84 2>/dev/null)"
            "$(which php83 2>/dev/null)"
            "$(which php82 2>/dev/null)"
            "$(which php 2>/dev/null)"
          )

          for candidate in "${CANDIDATES[@]}"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              VER=$("$candidate" -r "echo PHP_VERSION_ID;" 2>/dev/null || echo 0)
              if [ "$VER" -ge 80200 ]; then
                PHP_BIN="$candidate"
                break
              fi
            fi
          done

          if [ -z "$PHP_BIN" ]; then
            echo "Procurando outros binários PHP no sistema de arquivos..."
            FOUND_BINS=$(find /usr/local /opt /usr/bin -name "php*" 2>/dev/null | grep -E "bin/php[0-9.]*$" || true)
            for candidate in $FOUND_BINS; do
              if [ -x "$candidate" ]; then
                VER=$("$candidate" -r "echo PHP_VERSION_ID;" 2>/dev/null || echo 0)
                if [ "$VER" -ge 80200 ]; then
                  PHP_BIN="$candidate"
                  break
                fi
              fi
            done
          fi

          if [ -z "$PHP_BIN" ]; then
            echo "ERRO: Nenhum interpretador PHP 8.2 ou superior encontrado na Hostnet."
            echo "Versão padrão disponível no PATH:"
            php -v || true
            exit 1
          fi

          echo "Interpretador PHP selecionado: $PHP_BIN ($("$PHP_BIN" -v | head -n 1))"
          echo ""

          "$PHP_BIN" "$TARGET_PATH/database/runner.php"
          echo ""
          "$PHP_BIN" "$TARGET_PATH/database/runner.php" --status
          EOF
