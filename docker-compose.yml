services:
  app:
    image: php:8.2-apache
    container_name: cantina_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    command: >
      bash -c "a2enmod rewrite headers &&
               docker-php-ext-install pdo pdo_mysql &&
               apache2-foreground"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: cantina_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cantina
    volumes:
      - db_data:/var/lib/mysql

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: cantina_gotenberg
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  db_data:
